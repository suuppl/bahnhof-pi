name: image

# Builds the arm64 container image and pushes it to ghcr.io:
#   ghcr.io/<owner>/bahnhof-pi:sha-<commit>       runtime image (also :main, :latest, :<version>)
#   ghcr.io/<owner>/bahnhof-pi:sha-<commit>-sdk   build stage, base for out-of-tree plugins
# See docs/docker.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # native arm64 runner: no QEMU emulation (the Pi is arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags (runtime)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Tags (sdk)
        id: meta-sdk
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-sdk,onlatest=true
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push sdk
        uses: docker/build-push-action@v6
        with:
          context: .
          target: sdk
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-sdk.outputs.tags }}
          labels: ${{ steps.meta-sdk.outputs.labels }}
          cache-from: type=gha
