# Example: build and run the board as a container on the Pi (see docs/docker.md).
# Put it next to your bahnhofstafel.conf / line_colors.json (and plugins/, optional).
services:
  bahnhofstafel:
    build:
      # pin a full commit hash (BuildKit can't resolve short ones); bump it to update
      context: https://github.com/suuppl/bahnhof-pi.git#<full-commit-sha>
      # optional: your own single-file plugins (plugins/*.c), compiled into the image
      # additional_contexts:
      #   plugins: ./plugins
    image: bahnhofstafel:local
    container_name: bahnhofstafel
    restart: unless-stopped
    init: true
    devices:
      - /dev/fb0          # display
      - /dev/tty1         # console -> graphics mode
      - /dev/i2c-2        # brightness_ctl (DDC/CI) — remove if unused
      - /dev/ttyAMA0      # presence_ctl (radar UART) — remove if unused
    environment:
      TZ: Europe/Berlin   # IRIS times are German local time
    volumes:
      - ./bahnhofstafel.conf:/app/bahnhofstafel.conf:ro
      - ./line_colors.json:/app/line_colors.json:ro
      - cache:/app/cache

volumes:
  cache:
