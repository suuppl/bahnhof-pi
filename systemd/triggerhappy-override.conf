# Drop-in installed to /etc/systemd/system/triggerhappy.service.d/override.conf
# Runs thd as root (drops the default "--user nobody") so the hotkey commands
# can invoke "systemctl stop/start bahnhofstafel.service".
[Service]
ExecStart=
ExecStart=/usr/sbin/thd --triggers /etc/triggerhappy/triggers.d/ --socket /run/thd.socket --deviceglob /dev/input/event*
