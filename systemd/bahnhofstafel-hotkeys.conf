# triggerhappy hotkeys for the bahnhofstafel display.
# Installed to /etc/triggerhappy/triggers.d/bahnhofstafel.conf
#
# Format: <trigger-key>[+<modifier>...]  <value>  <command>
#   - the TRIGGER key comes first; modifiers (Ctrl/Alt) are appended with '+'
#   - value 1 = key press
#   - fields are whitespace-separated
# thd must run as root (see triggerhappy.service.d/override.conf) so systemctl works.

# Ctrl+Alt+S  -> stop all bahnhofstafel processes
KEY_S+KEY_LEFTCTRL+KEY_LEFTALT   1   /usr/bin/systemctl stop bahnhofstafel.service

# Ctrl+Alt+R  -> (re)start the display
KEY_R+KEY_LEFTCTRL+KEY_LEFTALT   1   /usr/bin/systemctl restart bahnhofstafel.service
